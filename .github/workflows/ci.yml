name: Local checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned lint tool
        run: python -m pip install -r requirements-dev.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r benchmark-aws/requirements-benchmark.txt
      - name: Lint and check formatting
        run: |
          ruff check benchmark-aws/*.py benchmark-aws/autotune/*.py tests/*.py
          ruff format --check benchmark-aws/*.py benchmark-aws/autotune/*.py tests/*.py
      - name: Test Python components
        run: python -m unittest discover -s tests -v
      - name: Test queue timings
        run: |
          g++ -std=c++17 -DNDEBUG -Wall -Wextra -pthread -I include tests/test_batch_timings.cpp -o /tmp/test_batch_timings
          timeout 10s /tmp/test_batch_timings
      - name: Check remote script syntax
        run: bash -n benchmark-aws/remote.sh setup.sh benchmark-aws/multihost/*.sh
